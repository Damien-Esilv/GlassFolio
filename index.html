<!DOCTYPE html>
<html lang="en" class="dark" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: '#137fec',
              background: 'var(--bg-background)',
              'accent-green': '#10b981',
              'accent-red': '#ef4444',
              // Mapping standard slate colors to our variables for compatibility if needed
              slate: {
                800: 'var(--bg-card)', // Mapping card background to slate-800 utility use
                900: 'var(--bg-background)',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              display: ['Inter', 'sans-serif'],
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-background: #ffffff;
        --bg-card: rgba(0, 0, 0, 0.05); /* Light mode card */
        --text-main: #000000;
        --text-muted: rgba(0, 0, 0, 0.6);
      }

      [data-theme='light'] {
        --bg-background: #f6f7f8;
        --bg-card: rgba(255, 255, 255, 0.5);
        --text-main: #000000;
        --text-muted: rgba(0, 0, 0, 0.6);
      }

      /* Neutral Dark */
      [data-theme='dark'] {
        --bg-background: #18181b; /* Zinc 900 */
        --bg-card: rgba(255, 255, 255, 0.05);
        --text-main: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
      }

      /* Blue Night (Template Default) */
      [data-theme='night'] {
        --bg-background: #101922; /* Template Dark BG */
        --bg-card: rgba(0, 0, 0, 0.2); /* Template Card BG */
        --text-main: #ffffff;
        --text-muted: rgba(255, 255, 255, 0.6);
      }

      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--bg-background);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-background); 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6"
  }
}
</script>
</head>
  <body class="font-display">
    <div id="root"></div>
  </body>
</html>
