# GlassFolio self-hosted (local mode). Start with: npm run docker:up   (= docker compose --env-file docker/docker.env up -d --build)
# Data lives in the `glassfolio-data` volume (encrypted vault records). Back it up with:
#   docker run --rm -v glassfolio-data:/data -v "$PWD":/backup alpine tar czf /backup/glassfolio-data.tgz -C /data .
# To store data in a host folder instead, set GLASSFOLIO_DATA (the folder must be writable by uid 1000).
services:
  glassfolio:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: glassfolio:local
    container_name: glassfolio-app
    restart: unless-stopped
    init: true
    ports:
      # Localhost only by default. Set GLASSFOLIO_BIND=0.0.0.0 to expose it on your network.
      - "${GLASSFOLIO_BIND:-127.0.0.1}:${GLASSFOLIO_PORT:-3780}:8080"
    volumes:
      - ${GLASSFOLIO_DATA:-glassfolio-data}:/data
      - glassfolio-woob-token:/run/glassfolio-token:ro
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      # Comma-separated domain names allowed to use the vault API (reverse proxy with a hostname).
      # localhost and IP addresses always work.
      ALLOWED_HOSTS: ${GLASSFOLIO_ALLOWED_HOSTS:-}
      # Required login when GLASSFOLIO_BIND exposes the port (>= 16 chars). Set it in your shell, never in a file.
      ACCESS_TOKEN: ${GLASSFOLIO_ACCESS_TOKEN:-}
      # Extra origins the page may call (e.g. a remote Ollama: https://ollama.example.com), space-separated.
      CSP_CONNECT_SRC: ${GLASSFOLIO_CSP_CONNECT_SRC:-}
      # 1 = open on the demo account (GLASSFOLIO_DEMO=1 npm run docker:up); unset = no demo offered.
      GLASSFOLIO_DEMO: ${GLASSFOLIO_DEMO:-}
      # French banks (TGLA-239): the `woob` container of the `woob` profile, when it runs. Its token is written
      # on its first start to the glassfolio-woob-token volume, mounted read-only below.
      GLASSFOLIO_WOOB_URL: http://woob:47832
      GLASSFOLIO_WOOB_TOKEN_FILE: /run/glassfolio-token/token
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Resource ceilings: a runaway request cannot take the host down
    mem_limit: 512m
    pids_limit: 128

  # French banks through Woob (TGLA-239), optional:  docker compose --env-file docker/docker.env --profile woob up -d --build
  # Reads your bank accounts from this machine. Its port stays on the Compose network: only the GlassFolio server reaches it.
  # Bank sessions (cookies) live in the glassfolio-woob volume; bank credentials are never written, they stay in your vault.
  woob:
    profiles: ["woob"]
    build:
      context: .
      dockerfile: docker/woob.Dockerfile
    image: glassfolio-woob:local
    container_name: glassfolio-woob
    restart: unless-stopped
    init: true
    volumes:
      - glassfolio-woob:/data
      - glassfolio-woob-token:/run/glassfolio-token
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 64

volumes:
  glassfolio-data:
  glassfolio-woob:
  glassfolio-woob-token:
