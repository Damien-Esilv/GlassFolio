version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Runtime and CI run on Node 22 LTS; keep @types/node aligned with Node 22.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci

  # Keeps the pinned node:22-alpine digest of the self-hosted image current (Epic E31).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Stay on Node 22 LTS digest updates; do not auto-bump to non-LTS odd releases (e.g. node:25).
      - dependency-name: 'node'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
