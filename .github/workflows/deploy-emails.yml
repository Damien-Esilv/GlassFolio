name: Deploy — Supabase Branded Email Templates

on:
  push:
    branches: [main, 'feat/tgla-084-branded-auth-emails']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run only (preview diff without applying changes)'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy-email-templates:
    name: ✉️ Deploy Email Templates & Auth Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify template compilation & integrity
        run: npm test tests/unit/scripts/emailTemplates.test.ts

      - name: Deploy templates to Supabase Auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "Running in dry-run mode..."
            npm run deploy:emails
          else
            echo "Applying email templates and settings to Supabase..."
            npm run deploy:emails:apply
          fi
