name: Notion — Task Auto-Sync

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

# Least privilege: the job only reads the repository (Notion is called with its own token).
permissions:
  contents: read

concurrency:
  group: notion-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-notion:
    name: 📝 Sync Tasks to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Run Notion Task Sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_TASKS_DB_ID: ${{ secrets.NOTION_TASKS_DB_ID || '73594813-9137-82eb-887a-8157fd353c7a' }}
        run: node scripts/notion-sync.mjs
