name: CD — Production Smoke Test

# Runs after Vercel promotes a deployment to the production domains (which, with
# Deployment Checks enabled, only happens once "CI — Required" is green).
# Non-blocking by design: a required post-promotion check would deadlock promotion.
# On failure: investigate, then roll back with `vercel rollback` or the Vercel dashboard.
#
# NB: repository_dispatch workflows only run from the default branch.
on:
  repository_dispatch:
    types: ['vercel.deployment.promoted']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: 🚦 Production smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Smoke test glassfolio.dev and app.glassfolio.dev
        run: node scripts/smoke-production.mjs
