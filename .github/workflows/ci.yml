name: CI — GlassFolio Quality Gate

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'ci/**', 'test/**']
  pull_request:
    branches: [main, develop]

# DevSecOps least-privilege permission at workflow root
permissions:
  contents: read

# Cancel superseded runs on feature branches. Never on main: Vercel Deployment Checks
# hold the production deployment of a main commit until its "CI — Required" run is green,
# so cancelling that run would leave production waiting forever (Epic E19 — TGLA-132).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Pipeline shape (Epic E19 — TGLA-134): Gate 1 first (integrity must precede any job that
# executes repository code), then every other gate in parallel, then the aggregate check.
#
#   Gate 1 ─┬─ Gate 2 (types, lint, i18n, emails)
#           ├─ Gate 3 (standards)
#           ├─ Gate 4 security suite ×2 shards
#           ├─ Gate 4 unit tests ×4 shards ── coverage merge (thresholds enforced here)
#           ├─ MCP protocol
#           ├─ Gate 6 Docker image + persistence smoke test
#           └─ Gate 5 builds ×4 (local, cloud app, showcase, Vercel parity)
#                         └──────────────────── CI — Required (the only check Vercel gates on)
jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 1 — Integrity & Dependency Audit
  # ═══════════════════════════════════════════════════════════════════════════
  gate-1-integrity-audit:
    name: 🔒 Gate 1 — Integrity & Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Audit production dependencies (high/critical vulnerabilities)
        run: npm audit --audit-level=high --omit=dev

      - name: Verify Supply Chain SHA-512 cryptographic integrity
        run: node scripts/verify-supply-chain-sha.mjs

      - name: Static secret pattern scan
        run: |
          echo "Scanning for hardcoded secrets or access tokens..."
          PATTERNS=('sk-[a-zA-Z0-9]{32,}' 'pk_live_[a-zA-Z0-9]+' 'AKIA[0-9A-Z]{16}' 'ghp_[a-zA-Z0-9]{36}')
          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            if grep -rE "$PATTERN" src/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
              echo "::error::Potential hardcoded secret detected: $PATTERN"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then
            exit 1
          fi
          echo "No hardcoded secrets detected in source code."

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 2 — Type Safety, Linting & i18n
  # ═══════════════════════════════════════════════════════════════════════════
  gate-2-quality:
    name: 🔷 Gate 2 — Type Safety, Lint & i18n
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-1-integrity-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: TypeScript type checking
        run: npm run check:types

      - name: ESLint check (errors block CI)
        run: npm run lint

      - name: i18n keys completeness audit
        run: npm run check:i18n

      - name: Verify template compilation & integrity (Epic E25)
        run: npx vitest run tests/unit/scripts/emailTemplates.test.ts

      - name: Dry-run check for email templates & config diff (Epic E25)
        if: github.ref == 'refs/heads/main'
        run: npm run deploy:emails
        env:
          DRY_RUN: 'true'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        continue-on-error: true

      - name: Dry-run check for Turnstile anti-bot config diff (Epic E22)
        if: github.ref == 'refs/heads/main'
        run: npm run deploy:turnstile
        env:
          DRY_RUN: 'true'
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        continue-on-error: true

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 3 — Architectural & Coding Standards
  # ═══════════════════════════════════════════════════════════════════════════
  gate-3-standards:
    name: 🎨 Gate 3 — Architectural Standards & Storage Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-1-integrity-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Standalone standards verification script
        run: node scripts/check-standards.mjs

      - name: vercel.json security headers (CSP) in sync with server/securityHeaders.mjs
        run: npm run check:headers

      - name: Audit design standards (Vitest)
        run: npx vitest run tests/unit/standards --reporter=verbose

      - name: Theming components tests (Vitest)
        run: npx vitest run tests/unit/components/theming --reporter=verbose

      - name: Architecture & storage invariants (Vitest)
        run: npx vitest run tests/unit/services/security/architectureInvariants.test.ts --reporter=verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 4 — Security suite, sharded unit tests and merged coverage
  # ═══════════════════════════════════════════════════════════════════════════
  gate-4-security:
    name: 🛡️ Gate 4 — Security Test Suite (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate-1-integrity-audit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Run dedicated security test suite (shard ${{ matrix.shard }}/2)
        run: npx vitest run tests/unit/services/security tests/unit/services/ai/tools/securityTools.test.ts --shard=${{ matrix.shard }}/2

  gate-4-tests:
    name: 🧪 Gate 4 — Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-1-integrity-audit]
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      # Each shard sees only a slice of the suite: coverage thresholds are deferred to
      # the merge job (VITEST_PARTIAL_COVERAGE=1 in the npm script switches them off).
      - name: Run unit tests shard ${{ matrix.shard }}/4 with coverage
        run: npm run test:coverage:shard -- --shard=${{ matrix.shard }}/4 --outputFile=.vitest-reports/blob-${{ matrix.shard }}.json

      - name: Upload shard report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/blob-${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  gate-4-coverage:
    name: 📊 Gate 4 — Merged Coverage Thresholds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate-4-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Download shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      # Replays every shard and enforces the thresholds from vitest.config.ts on the
      # merged data: 70/60 global and 90 lines / 78 branches on src/services/security/**.
      - name: Merge reports and enforce coverage thresholds
        run: npm run test:coverage:merge

      - name: Confirm the coverage report was produced
        run: test -f coverage/lcov.info || (echo "::error::Coverage report not generated" && exit 1)

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # MCP SERVER & AI TOOLS PROTOCOL VERIFICATION
  # ═══════════════════════════════════════════════════════════════════════════
  mcp-protocol:
    name: 🤖 MCP Server & Security AI Tools Protocol
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate-1-integrity-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Syntax check MCP server
        run: npm run check:mcp

      - name: Verify MCP tools/list includes security and gamification tools
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node mcp-server/index.mjs)
          echo "MCP tools/list response: $RESPONSE"
          echo "$RESPONSE" | grep -q "get_security_status" || (echo "::error::Missing get_security_status tool" && exit 1)
          echo "$RESPONSE" | grep -q "list_vault_secrets" || (echo "::error::Missing list_vault_secrets tool" && exit 1)
          echo "$RESPONSE" | grep -q "lock_vault" || (echo "::error::Missing lock_vault tool" && exit 1)
          echo "$RESPONSE" | grep -q "rotate_encryption_key" || (echo "::error::Missing rotate_encryption_key tool" && exit 1)
          echo "$RESPONSE" | grep -q "get_gamification_status" || (echo "::error::Missing get_gamification_status tool" && exit 1)

      - name: Test MCP tools/call safe bridge fallback
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_security_status","arguments":{}}}' | node mcp-server/index.mjs)
          echo "MCP security status response: $RESPONSE"
          echo "$RESPONSE" | grep -q "GlassFolio is not connected" || (echo "::error::Expected safe disconnected bridge message" && exit 1)

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 5 — Production Builds & Bundle Budgets
  #   local / cloud-app / showcase: the split builds (Docker + per-domain targets)
  #   vercel-parity: the exact unified build Vercel ships to glassfolio.dev and
  #                  app.glassfolio.dev (`npm run build` with the cloud env)
  # ═══════════════════════════════════════════════════════════════════════════
  gate-5-build:
    name: 🏗️ Gate 5 — Build & Bundle Budget (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-1-integrity-audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: local
            build_cmd: npm run build:local
            # 2560 -> 2592: MCP bridge (settings, tab client, executor) and its texts, TGLA-198
            limit_kb: 2592
            landing: absent
            smoke: false
          - label: cloud-app
            build_cmd: npm run build:app
            # 2560 -> 2592: same MCP bridge code as the local build, TGLA-198
            limit_kb: 2592
            landing: absent
            smoke: false
          - label: showcase
            build_cmd: npm run build:showcase
            # 1408 -> 1440: prerender runtime and French URLs (SEO texts, head updates, 404 page, TGLA-193, TGLA-194)
            # 1440 -> 1536: contact and MCP documentation pages with the tool catalog, TGLA-197, TGLA-198
            limit_kb: 1536
            landing: present
            smoke: false
          - label: vercel-parity
            build_cmd: GLASSFOLIO_BUILD_TARGET=showcase npm run build:vercel
            # 2560 -> 2624: Google Drive split-trust (OIDC, Drive key, device key, recovery modal) adds ~35 KB.
            # The showcase project's real build (TGLA-193); the app project matches cloud-app
            limit_kb: 1536
            landing: present
            smoke: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Build production bundle (${{ matrix.label }})
        run: ${{ matrix.build_cmd }}

      - name: Check bundle budget and Landing chunk expectation
        env:
          LABEL: ${{ matrix.label }}
          LIMIT_KB: ${{ matrix.limit_kb }}
          SCREENSHOTS_LIMIT_KB: 1024
          LANDING: ${{ matrix.landing }}
        run: |
          # Code and product screenshots are budgeted separately: images must not hide code growth.
          SCREENSHOTS_KB=$( [ -d dist/screenshots ] && du -sk dist/screenshots | cut -f1 || echo 0 )
          # Prerendered HTML holds page text, not code
          PRERENDER_KB=$( [ -d dist/_p ] && du -sk dist/_p dist/404.html | cut -f1 | paste -sd+ - | bc || echo 0 )
          BUNDLE_SIZE=$(( $(du -sk dist/ | cut -f1) - SCREENSHOTS_KB - PRERENDER_KB ))
          echo "${LABEL} bundle size: ${BUNDLE_SIZE}KB (limit ${LIMIT_KB}KB), screenshots: ${SCREENSHOTS_KB}KB (limit ${SCREENSHOTS_LIMIT_KB}KB)"
          if [ "$BUNDLE_SIZE" -gt "$LIMIT_KB" ]; then
            echo "::error::${LABEL} bundle size ${BUNDLE_SIZE}KB exceeds the ${LIMIT_KB}KB limit"
            exit 1
          fi
          if [ "$SCREENSHOTS_KB" -gt "$SCREENSHOTS_LIMIT_KB" ]; then
            echo "::error::${LABEL} screenshots weigh ${SCREENSHOTS_KB}KB, over the ${SCREENSHOTS_LIMIT_KB}KB limit (npm run screenshots)"
            exit 1
          fi
          if [ "$LANDING" = "absent" ]; then
            if ls dist/assets/Landing-*.js 1> /dev/null 2>&1; then
              echo "::error::Landing chunk was unexpectedly bundled into the ${LABEL} build!"
              exit 1
            fi
            echo "✅ ${LABEL} build verified: zero showcase assets bundled."
          else
            if ! ls dist/assets/Landing-*.js 1> /dev/null 2>&1; then
              echo "::error::Landing chunk missing from the ${LABEL} build!"
              exit 1
            fi
            echo "✅ ${LABEL} build verified: showcase chunk emitted."
          fi

      # The Vercel layout has no dist/index.html (vercel.json rewrites to these files): check they
      # are served, hold their content and need no inline script (script-src 'self').
      - name: Smoke test the prerendered output (vite preview)
        if: ${{ matrix.smoke }}
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4173/app-shell.html && break
            sleep 1
          done
          curl -fsS http://localhost:4173/app-shell.html | grep -qi "<div id=\"root\"" || (echo "::error::SPA shell missing" && exit 1)
          curl -fsS http://localhost:4173/_p/en/index.html | grep -qi "<h1" || (echo "::error::Prerendered home has no content" && exit 1)
          ! curl -fsS http://localhost:4173/_p/en/index.html | sed -n '/<div id="root"/,$p' | grep -qi "<script" || (echo "::error::Inline script in prerendered HTML" && exit 1)
          echo "✅ vite preview serves the SPA shell and the prerendered pages."

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.label }}
          path: dist/
          retention-days: 7

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 6 — Self-hosted Docker image (Epic E31 — TGLA-137)
  #   Builds docker/Dockerfile, runs it with the docker-compose hardening and checks the
  #   app shell, the Yahoo proxy allow-list and that data survives a container restart.
  # ═══════════════════════════════════════════════════════════════════════════
  gate-6-docker:
    name: 🐳 Gate 6 — Docker image & persistence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate-1-integrity-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node & install
        uses: ./.github/actions/setup

      - name: Build the image and run the smoke test
        run: npm run docker:smoke

  # ═══════════════════════════════════════════════════════════════════════════
  # CI — Required (aggregate)
  # The single check that Vercel Deployment Checks and branch protection require.
  # Keep this job name stable: renaming it silently disables the production gate.
  # ═══════════════════════════════════════════════════════════════════════════
  ci-required:
    name: CI — Required
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - gate-1-integrity-audit
      - gate-2-quality
      - gate-3-standards
      - gate-4-security
      - gate-4-tests
      - gate-4-coverage
      - mcp-protocol
      - gate-5-build
      - gate-6-docker
    steps:
      - name: Fail unless every gate succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null; then
            echo "✅ All gates passed."
          else
            echo "::error::At least one gate did not succeed — production must not be promoted."
            exit 1
          fi
