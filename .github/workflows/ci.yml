name: CI — GlassFolio Quality Gate

on:
  push:
    branches: [main, develop, 'feat/**', 'fix/**', 'refactor/**']
  pull_request:
    branches: [main, develop]

# DevSecOps least-privilege permission at workflow root
permissions:
  contents: read

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 1 — Integrity & Dependency Audit
  # ═══════════════════════════════════════════════════════════════════════════
  gate-1-integrity-audit:
    name: 🔒 Gate 1 — Integrity & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Audit production dependencies (high/critical vulnerabilities)
        run: npm audit --audit-level=high --omit=dev

      - name: Static secret pattern scan
        run: |
          echo "Scanning for hardcoded secrets or access tokens..."
          PATTERNS=('sk-[a-zA-Z0-9]{32,}' 'pk_live_[a-zA-Z0-9]+' 'AKIA[0-9A-Z]{16}' 'ghp_[a-zA-Z0-9]{36}')
          FOUND=0
          for PATTERN in "${PATTERNS[@]}"; do
            if grep -rE "$PATTERN" src/ pages/ components/ --include="*.ts" --include="*.tsx" 2>/dev/null; then
              echo "::error::Potential hardcoded secret detected: $PATTERN"
              FOUND=1
            fi
          done
          if [ $FOUND -ne 0 ]; then
            exit 1
          fi
          echo "No hardcoded secrets detected in source code."

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 2 — Type Safety, Linting & i18n
  # ═══════════════════════════════════════════════════════════════════════════
  gate-2-quality:
    name: 🔷 Gate 2 — Type Safety, Lint & i18n
    runs-on: ubuntu-latest
    needs: [gate-1-integrity-audit]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type checking
        run: npm run check:types

      - name: ESLint check (errors block CI)
        run: npx eslint . --ext .ts,.tsx --quiet

      - name: i18n keys completeness audit
        run: npm run check:i18n

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 3 — Architectural & Coding Standards
  # ═══════════════════════════════════════════════════════════════════════════
  gate-3-standards:
    name: 🎨 Gate 3 — Architectural Standards & Storage Invariants
    runs-on: ubuntu-latest
    needs: [gate-2-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Standalone standards verification script
        run: node scripts/check-standards.mjs

      - name: Audit design standards (Vitest)
        run: npx vitest run tests/unit/standards --reporter=verbose

      - name: Theming components tests (Vitest)
        run: npx vitest run tests/unit/components/theming --reporter=verbose

      - name: Architecture & storage invariants (Vitest)
        run: npx vitest run tests/unit/services/security/architectureInvariants.test.ts --reporter=verbose

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 4 — Security & Unit Test Suite
  # ═══════════════════════════════════════════════════════════════════════════
  gate-4-tests:
    name: 🧪 Gate 4 — Security & Unit Test Suite
    runs-on: ubuntu-latest
    needs: [gate-3-standards]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run dedicated security test suite
        run: npm run test:security

      - name: Run all unit tests with coverage thresholds
        run: npm run test:coverage

      - name: Check security coverage threshold (>= 90% lines on src/services/security/**)
        run: |
          echo "Verifying security module coverage thresholds..."
          # coverage/lcov.info is generated by vitest coverage
          test -f coverage/lcov.info || (echo "::error::Coverage report not generated" && exit 1)

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # ═══════════════════════════════════════════════════════════════════════════
  # MCP SERVER & AI TOOLS PROTOCOL VERIFICATION
  # ═══════════════════════════════════════════════════════════════════════════
  mcp-protocol:
    name: 🤖 MCP Server & Security AI Tools Protocol
    runs-on: ubuntu-latest
    needs: [gate-3-standards]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Syntax check MCP server
        run: npm run check:mcp

      - name: Verify MCP tools/list includes security and gamification tools
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | node mcp-server/index.mjs)
          echo "MCP tools/list response: $RESPONSE"
          echo "$RESPONSE" | grep -q "get_security_status" || (echo "::error::Missing get_security_status tool" && exit 1)
          echo "$RESPONSE" | grep -q "list_vault_secrets" || (echo "::error::Missing list_vault_secrets tool" && exit 1)
          echo "$RESPONSE" | grep -q "lock_vault" || (echo "::error::Missing lock_vault tool" && exit 1)
          echo "$RESPONSE" | grep -q "rotate_encryption_key" || (echo "::error::Missing rotate_encryption_key tool" && exit 1)
          echo "$RESPONSE" | grep -q "get_gamification_status" || (echo "::error::Missing get_gamification_status tool" && exit 1)

      - name: Test MCP tools/call (get_security_status)
        run: |
          RESPONSE=$(echo '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_security_status","arguments":{}}}' | node mcp-server/index.mjs)
          echo "MCP security status response: $RESPONSE"
          echo "$RESPONSE" | grep -q "vaultStatus" || (echo "::error::Invalid get_security_status response" && exit 1)

  # ═══════════════════════════════════════════════════════════════════════════
  # GATE 5 — Dual-Mode Production Build & Bundle Budget
  # ═══════════════════════════════════════════════════════════════════════════
  gate-5-build:
    name: 🏗️ Gate 5 — Dual-Mode Production Build & Bundle Budget
    runs-on: ubuntu-latest
    needs: [gate-4-tests, mcp-protocol]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle in Local mode
        run: VITE_DEPLOYMENT_MODE=local npm run build

      - name: Check bundle size in Local mode (hard limit 2MB, warn at 1.5MB)
        run: |
          BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
          echo "Local mode bundle size: ${BUNDLE_SIZE}KB"
          if [ $BUNDLE_SIZE -gt 2048 ]; then
            echo "::error::Local bundle size ${BUNDLE_SIZE}KB exceeds 2MB limit"
            exit 1
          fi

      - name: Build production bundle in Cloud mode
        run: VITE_DEPLOYMENT_MODE=cloud npm run build

      - name: Check bundle size in Cloud mode (hard limit 2MB, warn at 1.5MB)
        run: |
          BUNDLE_SIZE=$(du -sk dist/ | cut -f1)
          echo "Cloud mode bundle size: ${BUNDLE_SIZE}KB"
          if [ $BUNDLE_SIZE -gt 2048 ]; then
            echo "::error::Cloud bundle size ${BUNDLE_SIZE}KB exceeds 2MB limit"
            exit 1
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
