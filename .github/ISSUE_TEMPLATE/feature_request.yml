name: 💡 Feature Request
description: Suggest an idea or enhancement for GlassFolio
title: "feat: [short feature proposal]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement for GlassFolio!
  - type: textarea
    id: problem
    attributes:
      label: Problem statement or motivation
      description: Is your feature request related to a specific problem or friction in your workflow?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen and how it would improve the user experience.
      placeholder: "A clear and concise description of what you want to happen..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "Any alternative options you've thought about..."
