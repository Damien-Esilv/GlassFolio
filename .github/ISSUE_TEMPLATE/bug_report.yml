name: 🐛 Bug Report
description: Create a report to help us fix an unexpected error or issue
title: "fix: [short bug description]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Before reporting, please check if your issue is related to security: if it involves cryptographic keys or personal data, see our [Security Policy](https://github.com/Damien-Esilv/GlassFolio/security/policy).
  - type: input
    id: environment
    attributes:
      label: Deployment environment
      description: How are you running GlassFolio? (e.g. Docker container, npm run dev, self-hosted NAS, etc.)
      placeholder: "e.g. Docker Compose, Ubuntu 24.04, Node 22"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear and concise description of what the bug is.
      placeholder: "Describe the unexpected behavior..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
      placeholder: "Describe what should have happened..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console logs or screenshots
      description: Please paste any relevant browser console logs or error outputs (redact any personal financial figures).
